if(f&&f.t=='s')h+=`<div style='display:flex;gap:.6em;margin:.6em 0'>${['m','b','c'].map(k=>`<div data-slot='${k}' style='border:1px dashed var(--edge);padding:.8em;min-width:6em;text-align:center'><small>${UPG[k][0]}</small><br>${f[k]?'Niv '+f[k]:'—'}</div>`).join('')}</div><p>Portée ${Math.round(RNG(f)/TS/2)} cases · Vitesse ×${MOTF[f.m]} · Résistance ${f.c}</p>${f.st=='broken'?`<button data-fix='1'>Réparer (8 données)</button>`:''}`;
h+=`<h3>Inventaire</h3>${INV.length?INV.map((it,i)=>`<button class='nd ${i==ISEL?'ok':''}' draggable='true' data-it='${i}'>${UPG[it.s][0]} niv ${it.l}</button>`).join(''):'<p>Vide : fabrique des pièces à l’Atelier.</p>'}`}
else if(DSUB=='a')h+=`<p>Fabrique des améliorations avec des données.</p>`+['m','b','c'].map(k=>UPG[k][1].map((c,l)=>`<button class='nd' data-cr='${k}${l+1}' ${st>=ULV[l]&&DATA>=c?'':'disabled'}><b>${UPG[k][0]} niv ${l+1}</b><em>${c} Données${st<ULV[l]?' · plus tard dans l’histoire':''}</em></button>`).join('')).join('');
else h+=`<p>Hub : tous les drones arrivent ici.</p>`+DF.map(q=>`<div>${NM(q)} — ${q.st=='broken'?'en panne':busy(q)?'en mission':'en charge'}</div>`).join('')+`<button data-tow='1' ${st>=20&&DATA>=80&&DF.filter(q=>q.t=='t').length<5?'':'disabled'}>Remorqueur (80 données, max 5)</button>`;return h}
function equip(k){const f=DF[DSEL],it=INV[ISEL];if(!f||f.t!='s'||!it||it.s!=k)return;if(f[k])INV.push({s:k,l:f[k]});f[k]=it.l;INV.splice(ISEL,1);ISEL=-1;sfx('build');renderLab()}
{const _rl=renderLab;renderLab=function(){_rl();const q=(a,fn)=>$('pnl').querySelectorAll(a).forEach(fn);q('[data-ds]',b=>b.onclick=()=>{DSUB=b.dataset.ds;renderLab()});q('[data-sel]',b=>b.onclick=()=>{DSEL=+b.dataset.sel;renderLab()});
q('[data-it]',b=>{b.onclick=()=>{ISEL=ISEL==+b.dataset.it?-1:+b.dataset.it;renderLab()};b.ondragstart=()=>{ISEL=+b.dataset.it}});q('[data-slot]',b=>{b.onclick=()=>equip(b.dataset.slot);b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();equip(b.dataset.slot)}});
q('[data-cr]',b=>b.onclick=()=>{const k=b.dataset.cr[0],l=+b.dataset.cr.slice(1),c=UPG[k][1][l-1];if(DATA<c||st<ULV[l-1])return;DATA-=c;INV.push({s:k,l});sfx('data');renderLab()});
q('[data-fix]',b=>b.onclick=()=>{const f=DF[DSEL];if(f&&DATA>=8){DATA-=8;f.st='idle';renderLab()}});q('[data-tow]',b=>b.onclick=()=>{if(DATA>=80){DATA-=80;DF.push({t:'t',st:'idle',id:DF.filter(x=>x.t=='t').length+1});sfx('build');renderLab()}})}}
{const _s=saveGame,_l=loadGame;saveGame=function(){_s();try{const o=JSON.parse(localStorage.getItem(SK));if(!o)return;o.v20={DF:DF.map(f=>({...f})),INV,DEXT,BRK};localStorage.setItem(SK,JSON.stringify(o))}catch(e){}};loadGame=function(){_l();const s=readSave(),v=s&&s.v20;DF=v?v.DF:[];INV=v?v.INV:[];DEXT=v?v.DEXT:0;BRK=v?v.BRK:0}}

})();
</script></body></html>
